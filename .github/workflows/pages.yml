name: public demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: /Argus/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dashboard/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: verify anonymous demo
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$SITE_URL" --output /tmp/argus-index.html && \
               curl --fail --silent --show-error --location "${SITE_URL%/}/demo-data.json" --output /tmp/argus-demo-data.json; then
              break
            fi
            test "$attempt" -lt 12
            sleep 5
          done
          grep -q '/Argus/assets/' /tmp/argus-index.html
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/argus-demo-data.json').read_text())
          run_id = payload['runs'][0]['id']
          assert len(payload['metrics'][run_id]) == 21
          anomaly_types = {
              anomaly['type']
              for decision in payload['decisions'][run_id]
              for anomaly in decision['anomaly_types']
          }
          assert anomaly_types == {'grad_explosion', 'loss_spike'}
          PY
